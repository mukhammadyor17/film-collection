@if (film(); as film) {
<div class="detail">
  <div class="detail__poster">
    <img [src]="film.posterUrl" [alt]="film.title" />
  </div>

  <div class="detail__content">
    <span class="detail__genre">{{ film.genre }}</span>
    <h1 class="detail__title">{{ film.title }}</h1>

    <div class="detail__meta">
      <span>{{ film.year }}</span>
      <span class="detail__dot">·</span>
      <span>{{ film.duration | filmDuration }}</span>
      <span class="detail__dot">·</span>
      <span class="detail__rating">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
        </svg>
        {{ film.rating }}
      </span>
    </div>

    <p class="detail__description">{{ film.description }}</p>

    <button class="detail__back" (click)="goBack()">← Back</button>
  </div>
</div>
} @else {
<p class="detail__not-found">Film not found.</p>
}
